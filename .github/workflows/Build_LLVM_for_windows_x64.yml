name: Build LLVM for windows x64

on:
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: MinSizeRel

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7
      with:
        token: ${{secrets.PAT}}
        submodules: 'recursive'

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ninja-build tool
      uses: seanmiddleditch/gha-setup-ninja@v5
      with:
        version: "1.12.1"

    - name: Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: |
        cmake -G Ninja -S ${{github.workspace}}/llvm -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_ENABLE_PROJECTS="clang;lld" -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/build/llvm_install" -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_UTILS=OFF -DLLVM_INCLUDE_RUNTIMES=OFF -DLLVM_INCLUDE_DOCS=OFF -DLLVM_OBFUSCATION_LINK_INTO_TOOLS=ON -DLLVM_OBFUSCATION_INCLUDE_TESTS=ON -DCMAKE_CXX_FLAGS="/sdl-"

    - name: Build
      # Build your program with the given configuration
      run: |
        cd ${{github.workspace}}/build
        ninja

    - name: Test llvm-obf-core
      run: |
        cd ${{github.workspace}}/build
        ninja check-llvm-obf-core

    - name: Install
      run: |
        cd ${{github.workspace}}/build
        ninja install

    - name: Zip LLVM for Visual Studio
      shell: pwsh
      run: |
        $installDir = "${{github.workspace}}/build/llvm_install"
        $packageDir = "${{github.workspace}}/build/llvm_vs_install"
        $archivePath = "${{github.workspace}}/build/llvm_obf_Win64_VS_Minimal.zip"
        $packageBinDir = Join-Path $packageDir "bin"
        $readmePath = "${{github.workspace}}/llvm/lib/Transforms/llvm-obf-core/README.md"

        New-Item -ItemType Directory -Force -Path $packageBinDir | Out-Null

        if (-not (Test-Path -LiteralPath $readmePath -PathType Leaf)) {
          throw "llvm-obf-core README is missing: $readmePath"
        }
        Copy-Item -LiteralPath $readmePath -Destination $packageDir

        foreach ($tool in @("clang-cl.exe", "lld-link.exe", "llvm-lib.exe")) {
          $toolPath = Join-Path $installDir "bin/$tool"
          if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
            throw "Required Visual Studio tool is missing: $toolPath"
          }
          Copy-Item -LiteralPath $toolPath -Destination $packageBinDir
        }

        $clangCl = Join-Path $installDir "bin/clang-cl.exe"
        $resourceDir = (& $clangCl -print-resource-dir).Trim()
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resourceDir)) {
          throw "Unable to locate the Clang resource directory"
        }

        $resourceIncludeDir = Join-Path $resourceDir "include"
        if (-not (Test-Path -LiteralPath $resourceIncludeDir -PathType Container)) {
          throw "Clang resource headers are missing: $resourceIncludeDir"
        }

        $resourceVersion = Split-Path -Leaf $resourceDir
        $packageResourceDir = Join-Path $packageDir "lib/clang/$resourceVersion"
        New-Item -ItemType Directory -Force -Path $packageResourceDir | Out-Null
        Copy-Item -LiteralPath $resourceIncludeDir -Destination $packageResourceDir -Recurse

        7z a -y $archivePath "$packageDir/*"
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to create the Visual Studio package"
        }
        7z t $archivePath
        if ($LASTEXITCODE -ne 0) {
          throw "The Visual Studio package is invalid"
        }

    - name: Upload Visual Studio Build Artifact
      uses: actions/upload-artifact@v4.4.0
      with:
        name: llvm_obf_Win64_VS_Minimal.zip
        path: ${{github.workspace}}/build/llvm_obf_Win64_VS_Minimal.zip

